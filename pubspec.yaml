name: escrena
description: "نظام إدارة مخزن ومبيعات متكامل - Screena Shop"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Local Database
  drift: ^2.20.3
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24

  # Dependency Injection
  get_it: ^8.0.2

  # Routing
  go_router: ^14.2.7

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.2

  # Date/Time
  intl: ^0.20.2

  # Path operations
  path: ^1.9.0
  path_provider: ^2.1.4

  # Crypto (for password hashing)
  crypto: ^3.0.5

  # File operations (for backup)
  file_picker: ^8.1.3

  # URL launcher (for WhatsApp)
  url_launcher: ^6.3.1

  # Charts
  fl_chart: ^0.69.0

  # Icons
  cupertino_icons: ^1.0.8

  # Shared preferences (for settings)
  shared_preferences: ^2.3.3

  # UUID
  uuid: ^4.5.0

  # Google Fonts (Cairo Arabic)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.2
  build_runner: ^2.4.13
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
